name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build the extension (type-check + bundle)
        run: npm run build

      - name: Smoke test in Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test

      - name: Visual regression test
        env:
          CHROME_PATH: /usr/bin/google-chrome
        # Reference images for Linux are in tests/baseline/linux/. If a rendering change is
        # intended, download the "visual-output" artifact or run the test with --update on Linux.
        run: npm run test:visual

      - name: Upload visual test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-output
          path: tests/output
          if-no-files-found: ignore

      - name: Build the website
        run: npm run site:build

      - name: Package for the stores
        run: |
          npm run package
          npm run package:firefox
